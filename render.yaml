services:
  - type: web
    name: deploysphere-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: SIMULATOR_ENABLED
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_ADMIN_PASSWORD
        generateValue: true
      - key: DEMO_ADMIN_EMAIL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
